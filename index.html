<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Bauch-Trainingsplan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      color: #00e5ff;
    }

    .card {
      background: #1e1e1e;
      border-radius: 15px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }

    .hidden {
      display: none;
    }

    .number {
      font-size: 15px;
      color: #aaa;
    }

    .exercise-name {
      font-size: 28px;
      font-weight: bold;
      margin: 10px 0;
    }

    .exercise-goal {
      font-size: 20px;
      color: #00e5ff;
      margin-bottom: 20px;
    }

    .timer {
      font-size: 45px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      background: #00e5ff;
      border: none;
      color: #000;
      font-weight: bold;
      font-size: 17px;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      margin: 5px;
    }

    button.green {
      background: #00c853;
      color: #fff;
    }

    .tip {
      color: #bbb;
      font-size: 14px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💪 Bauch-Training</h1>

    <!-- Startbildschirm -->
    <div id="startScreen" class="card">
      <h2>Bereit?</h2>
      <p>Du machst 4 Übungen nacheinander.</p>
      <button onclick="startWorkout()">Training starten</button>
    </div>

    <!-- Übungsbildschirm -->
    <div id="exerciseScreen" class="card hidden">
      <p class="number" id="exerciseNumber"></p>
      <div class="exercise-name" id="exerciseName"></div>
      <div class="exercise-goal" id="exerciseGoal"></div>

      <div id="timerBox">
        <div class="timer" id="timer">30</div>
        <button id="timerButton" onclick="startTimer()">Timer starten</button>
      </div>

      <div id="repsBox" class="hidden">
        <p>Wie viele Wiederholungen hast du geschafft?</p>
        <button onclick="nextExercise()">Nächste Übung</button>
      </div>

      <p class="tip" id="exerciseTip"></p>
    </div>

    <!-- Endbildschirm -->
    <div id="finishScreen" class="card hidden">
      <h2>🎉 Training fertig!</h2>
      <p>Sehr gut gemacht. Denk ans Trinken und an eine Pause.</p>
      <button onclick="restartWorkout()">Nochmal trainieren</button>
    </div>
  </div>

  <script>
    let wakeLock = null;

    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (error) {
        console.log("Wake Lock nicht möglich:", error);
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        await requestWakeLock();
      }
    });

    requestWakeLock();

    const exercises = [
      {
        name: "Plank",
        goal: "Halte 30 Sekunden",
        type: "timer",
        time: 30,
        tip: "Gerader Rücken, Bauch anspannen, nicht durchhängen."
      },
      {
        name: "Crunches",
        goal: "Mach 15 Wiederholungen",
        type: "reps",
        tip: "Nur die Schultern anheben. Nicht am Nacken ziehen."
      },
      {
        name: "Beinheben liegend",
        goal: "Mach 12 Wiederholungen",
        type: "reps",
        tip: "Beine langsam heben und langsam absenken."
      },
      {
        name: "Russian Twists",
        goal: "Mach 20 Wiederholungen",
        type: "reps",
        tip: "Ohne Gewicht. Oberkörper leicht nach hinten lehnen."
      }
    ];

    let currentExercise = 0;
    let timerInterval = null;

    function startWorkout() {
      currentExercise = 0;
      showExercise();
    }

    function showExercise() {
      const exercise = exercises[currentExercise];

      document.getElementById("startScreen").classList.add("hidden");
      document.getElementById("finishScreen").classList.add("hidden");
      document.getElementById("exerciseScreen").classList.remove("hidden");

      document.getElementById("exerciseNumber").textContent =
        "Übung " + (currentExercise + 1) + " von " + exercises.length;
      document.getElementById("exerciseName").textContent = exercise.name;
      document.getElementById("exerciseGoal").textContent = exercise.goal;
      document.getElementById("exerciseTip").textContent = exercise.tip;

      if (exercise.type === "timer") {
        document.getElementById("timerBox").classList.remove("hidden");
        document.getElementById("repsBox").classList.add("hidden");
        document.getElementById("timer").textContent = exercise.time;
        document.getElementById("timerButton").textContent = "Timer starten";
        document.getElementById("timerButton").disabled = false;
      } else {
        document.getElementById("timerBox").classList.add("hidden");
        document.getElementById("repsBox").classList.remove("hidden");
      }
    }

    function startTimer() {
      const exercise = exercises[currentExercise];
      let timeLeft = exercise.time;

      document.getElementById("timerButton").disabled = true;
      document.getElementById("timer").textContent = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById("timer").textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById("timer").textContent = "Fertig!";
          setTimeout(nextExercise, 1000);
        }
      }, 1000);
    }

    function nextExercise() {
      currentExercise++;

      if (currentExercise < exercises.length) {
        showExercise();
      } else {
        document.getElementById("exerciseScreen").classList.add("hidden");
        document.getElementById("finishScreen").classList.remove("hidden");
      }
    }

    function restartWorkout() {
      startWorkout();
    }
  </script>
</body>
</html>
